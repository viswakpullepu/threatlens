<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ThreatLens AI Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #4f46e5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .val { font-weight: 700; color: #f8fafc; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 4px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #4f46e5; }
    input:checked + .slider:before { transform: translateX(16px); }
    .btn {
      display: block;
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      box-sizing: border-box;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div>
      <div class="title">ThreatLens AI Shield</div>
      <div class="subtitle">Live Gmail Avatar In-Mailbox Defense</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">In-Mailbox Threat Badges</span>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" style="margin-top: 8px;">
      <span class="label">Radar Status</span>
      <span class="val"><span class="status-dot"></span>ACTIVE</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Target Platform</span>
      <span class="val">mail.google.com</span>
    </div>
    <div class="row">
      <span class="label">Detection Vector</span>
      <span class="val">SPF / DKIM / IOCs</span>
    </div>
  </div>

  <a href="https://threatlens-gen.vercel.app" target="_blank" class="btn">
    Open ThreatLens Dashboard ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
