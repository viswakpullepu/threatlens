<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#09132b" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Cyber Blue Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Indian Tricolor Accent Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Deep Command Center Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Decorative Circuit Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Top Tricolor Accent Bar (SIH / National Pride) -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#saffronGrad)" />
  <rect x="400" y="0" width="400" height="5" fill="#FFFFFF" opacity="0.9" />
  <rect x="800" y="0" width="400" height="5" fill="url(#greenGrad)" />

  <!-- Left Cyber Shield Emblem with Pulsing Target -->
  <g transform="translate(65, 55)">
    <!-- Outer Shield Ambient Glow -->
    <path d="M75 10 L140 38 L140 115 C140 170 75 215 75 215 C75 215 10 170 10 115 L10 38 Z" fill="#0284c7" opacity="0.18" filter="url(#shieldGlow)" />
    
    <!-- Shield Outer Shell -->
    <path d="M75 10 L140 38 L140 115 C140 170 75 215 75 215 C75 215 10 170 10 115 L10 38 Z" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="3" />
    
    <!-- Inner Shield Infill -->
    <path d="M75 24 L128 48 L128 112 C128 156 75 194 75 194 C75 194 22 156 22 112 L22 48 Z" fill="#030712" stroke="#334155" stroke-width="1.5" />

    <!-- Stylized Eye / Crosshair Lens Symbol -->
    <circle cx="75" cy="110" r="36" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" filter="url(#glow)" />
    <circle cx="75" cy="110" r="22" fill="#0c4a6e" opacity="0.5" />
    <circle cx="75" cy="110" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="75" cy="110" r="6" fill="#ffffff" />
    
    <!-- Target Reticle Ticks -->
    <line x1="75" y1="64" x2="75" y2="76" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="75" y1="144" x2="75" y2="156" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="29" y1="110" x2="41" y2="110" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="109" y1="110" x2="121" y2="110" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Dynamic Scanning Radar Arc -->
    <path d="M75 74 A 36 36 0 0 1 111 110" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Top Badges Row -->
  <g transform="translate(255, 45)">
    <!-- SIH 2026 Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#FF9933" />
    <text x="26" y="19" class="font-sub" font-size="11" fill="#c7d2fe" letter-spacing="0.8">SMART INDIA HACKATHON 2026</text>

    <!-- Team CyberCore Pill Badge -->
    <rect x="232" y="0" width="165" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="246" cy="14" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="258" y="19" class="font-sub" font-size="11" fill="#e0f2fe" letter-spacing="0.8">TEAM CYBERCORE</text>

    <!-- National Cyber Defense Alignment Badge -->
    <rect x="408" y="0" width="240" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="422" cy="14" r="5" fill="#10B981" filter="url(#glow)" />
    <text x="434" y="19" class="font-sub" font-size="11" fill="#a7f3d0" letter-spacing="0.8">I4C / MHA DEFENSE READY</text>
  </g>

  <!-- Main Hero Title: THREATLENS AI -->
  <text x="255" y="132" class="font-head" font-size="52" fill="url(#cyberCyan)" letter-spacing="-1" filter="url(#glow)">
    THREATLENS AI
  </text>
  <text x="690" y="132" class="font-mono" font-size="14" fill="#94a3b8" letter-spacing="2">
    [v2.4-ENTERPRISE]
  </text>

  <!-- Subtitle Tagline -->
  <text x="255" y="168" class="font-sub" font-size="19" fill="#f8fafc" letter-spacing="0.2">
    Autonomous Email Forensics &amp; 3D Geospatial Threat Intelligence
  </text>
  <text x="255" y="196" class="font-head" font-size="13" fill="#94a3b8" letter-spacing="0.3">
    Unified Cryptographic Matrix (SPF/DKIM/DMARC) • NLP TF-IDF Semantic Engine • WebGL 3D SOC Operations
  </text>

  <!-- Bottom Metric Command Cards -->
  <g transform="translate(255, 230)">
    
    <!-- Metric 1: Latency -->
    <g transform="translate(0, 0)">
      <rect width="205" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="font-sub" font-size="10" fill="#94a3b8" letter-spacing="1">PROCESSING LATENCY</text>
      <text x="16" y="52" class="font-mono font-head" font-size="24" fill="#38bdf8">&lt; 40 ms</text>
      <text x="110" y="50" class="font-sub" font-size="10" fill="#10b981">Zero-Trust Local</text>
    </g>

    <!-- Metric 2: Cryptographic Proofs -->
    <g transform="translate(220, 0)">
      <rect width="205" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="font-sub" font-size="10" fill="#94a3b8" letter-spacing="1">CRYPTOGRAPHIC MATRIX</text>
      <text x="16" y="52" class="font-mono font-head" font-size="20" fill="#a855f7">SPF·DKIM·DMARC</text>
      <text x="16" y="66" class="font-sub" font-size="9" fill="#cbd5e1">Concurrent Alignment</text>
    </g>

    <!-- Metric 3: NLP TF-IDF Accuracy -->
    <g transform="translate(440, 0)">
      <rect width="205" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="font-sub" font-size="10" fill="#94a3b8" letter-spacing="1">NLP TF-IDF VECTORIZER</text>
      <text x="16" y="52" class="font-mono font-head" font-size="24" fill="#10b981">0% False Alarm</text>
      <text x="16" y="66" class="font-sub" font-size="9" fill="#cbd5e1">Coercive Urgency &amp; BEC</text>
    </g>

    <!-- Metric 4: Legal Evidence Section 65B -->
    <g transform="translate(660, 0)">
      <rect width="220" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="font-sub" font-size="10" fill="#94a3b8" letter-spacing="1">LEGAL COURT EVIDENCE</text>
      <text x="16" y="52" class="font-mono font-head" font-size="22" fill="#f59e0b">BSA Sec 65B</text>
      <text x="16" y="66" class="font-sub" font-size="9" fill="#cbd5e1">Audit-Ready PDF Dossier</text>
    </g>

  </g>

  <!-- Live Pulse Dot on Right Corner -->
  <g transform="translate(1120, 45)">
    <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.25" filter="url(#glow)">
      <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="10" r="5" fill="#10b981" />
    <text x="-48" y="14" class="font-mono" font-size="10" fill="#10b981" font-weight="bold">ACTIVE</text>
  </g>
</svg>
